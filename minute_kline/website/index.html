<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MarketForge two-year 5-minute A-share candlestick chart.">
    <title>MarketForge Minute K-Line</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="page-container">
        <header class="page-header">
            <div>
                <p class="project-label">MarketForge</p>
                <h1 id="chart-title">5-Minute Candlestick Chart</h1>
                <p class="page-description">Two-year minute-level market data · BaoStock</p>
            </div>
            <div id="connection-badge" class="status-badge" aria-live="polite">Initializing</div>
        </header>

        <section class="control-panel" aria-label="Chart controls">
            <label class="control-group">
                <span>Stock</span>
                <select id="stock-select" aria-label="Select stock"></select>
            </label>

            <label class="control-group">
                <span>Price type</span>
                <select id="adjust-select" aria-label="Select adjustment type">
                    <option value="qfq">QFQ</option>
                    <option value="unadjusted">Unadjusted</option>
                </select>
            </label>

            <button id="reset-view-button" class="secondary-button" type="button">Reset view</button>
        </section>

        <section class="data-summary">
            <div class="summary-item">
                <span class="summary-label">Bars</span>
                <strong id="bar-count">—</strong>
            </div>
            <div class="summary-item">
                <span class="summary-label">Start</span>
                <strong id="start-time">—</strong>
            </div>
            <div class="summary-item">
                <span class="summary-label">End</span>
                <strong id="end-time">—</strong>
            </div>
            <div class="summary-item">
                <span class="summary-label">OHLCV</span>
                <strong id="ohlcv-display">Move cursor over chart</strong>
            </div>
        </section>

        <section class="chart-card">
            <div id="chart" role="img" aria-label="Interactive stock candlestick chart"></div>
            <p id="loading-message" class="message loading-message" aria-live="polite"></p>
            <p id="error-message" class="message error-message" aria-live="assertive"></p>
        </section>

        <footer class="page-footer">
            Data source: BaoStock · Charting powered by
            <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">
                TradingView Lightweight Charts™
            </a>
        </footer>
    </main>

    <script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="./chart.js"></script>
</body>
</html>
